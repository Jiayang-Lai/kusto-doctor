name: Lint

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    environment: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        echo "Running in environment: $ENVIRONMENT_NAME"
        python -m pip install --upgrade pip
        pip install ruff
        
    - name: Run ruff linter
      run: |
        ruff check .
        
    - name: Run ruff formatter check
      run: |
        ruff format --check .
